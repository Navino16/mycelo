kind: enzyme
name: admin
septum: "^0.7"
description: Reads and administers the mycelium through scopes. Test fixture, never distributed.
requires:
  - rhiza: mycelium
    scopes: [plugins.read, plugins.toggle, plugins.configure, principals.read, roles.read, roles.assign, roles.manage, conversations.read, messages.broadcast, restrictions.manage, locale.manage]
commands:
  - name: plugins
    description: List installed plugins
    code: handlePlugins
  - name: whoami
    description: Report your principal and roles
    code: handleWhoami
  - name: roles
    description: List roles and their command patterns
    code: handleRoles
  - name: grant
    description: Give a role to someone on this channel
    code: handleGrant
    args:
      - name: role
        description: Role name
        required: true
      - name: who
        description: Channel handle of the recipient
        required: true
  - name: revoke
    description: Take a role away from someone on this channel
    code: handleRevoke
    args:
      - name: role
        description: Role name
        required: true
      - name: who
        description: Channel handle
        required: true
  - name: role-new
    description: Create a role with command patterns
    code: handleRoleNew
    args:
      - name: name
        description: Role name
        required: true
  - name: plugin-list
    description: List installed plugins and whether they are enabled
    code: handlePluginList
  - name: plugin-enable
    description: Enable an installed plugin
    code: handlePluginEnable
    args:
      - name: name
        description: Plugin name
        required: true
  - name: plugin-disable
    description: Disable an installed plugin
    code: handlePluginDisable
    args:
      - name: name
        description: Plugin name
        required: true
  - name: plugin-set
    description: Set one configuration value on a plugin
    code: handlePluginSet
    args:
      - name: name
        description: Plugin name
        required: true
      - name: key
        description: Setting key
        required: true
      - name: value
        description: Setting value
        required: true
  - name: plugin-config
    description: Show a plugin's settings, secrets redacted
    code: handlePluginConfig
    args:
      - name: name
        description: Plugin name
        required: true
  - name: conversations
    description: List conversations the bot has seen
    code: handleConversations
  - name: where-rule
    description: Confine a command pattern to direct messages or to groups
    code: handleWhereRule
    args:
      - name: pattern
        description: Command pattern
        required: true
      - name: where
        description: dm or group
        required: true
  - name: broadcast-add
    description: Add a broadcast target
    code: handleBroadcastAdd
    args:
      - name: channel
        description: Channel name
        required: true
      - name: conversation
        description: Conversation id
        required: true
  - name: broadcast
    description: Send one message to every configured target
    code: handleBroadcast
    args:
      - name: text
        description: What to send
        required: true
  - name: inhibitor-channels
    description: Confine an inhibitor to named channels
    code: handleInhibitorChannels
    args:
      - name: name
        description: Inhibitor name
        required: true
  - name: lang
    description: command.lang.description
    code: handleLang
    args:
      - name: locale
        description: arg.locale.description
        required: true
  - name: lang-group
    description: command.lang-group.description
    code: handleLangGroup
    args:
      - name: locale
        description: arg.locale.description
        required: true
