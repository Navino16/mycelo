kind: enzyme
name: admin
septum: "^0.7"
description: Reads and administers the mycelium through scopes. Test fixture, never distributed.
requires:
  - rhiza: mycelium
    scopes: [plugins.read, plugins.toggle, plugins.configure, principals.read,
             principals.manage, roles.read, roles.assign, roles.manage,
             conversations.read, messages.broadcast, messages.send,
             restrictions.manage, locale.manage, health.read, commands.read]
commands:
  - name: plugins
    description: command.plugins.description
    code: handlePlugins
  - name: whoami
    description: command.whoami.description
    code: handleWhoami
  - name: roles
    description: command.roles.description
    code: handleRoles
  - name: grant
    description: command.grant.description
    code: handleGrant
    args:
      - name: role
        description: Role name
        required: true
      - name: who
        description: Channel handle of the recipient
        required: true
  - name: revoke
    description: command.revoke.description
    code: handleRevoke
    args:
      - name: role
        description: Role name
        required: true
      - name: who
        description: Channel handle
        required: true
  - name: role-new
    description: command.role-new.description
    code: handleRoleNew
    args:
      - name: name
        description: Role name
        required: true
  - name: plugin-list
    description: command.plugin-list.description
    code: handlePluginList
  - name: plugin-enable
    description: command.plugin-enable.description
    code: handlePluginEnable
    args:
      - name: name
        description: Plugin name
        required: true
  - name: plugin-disable
    description: command.plugin-disable.description
    code: handlePluginDisable
    args:
      - name: name
        description: Plugin name
        required: true
  - name: plugin-set
    description: command.plugin-set.description
    code: handlePluginSet
    args:
      - name: name
        description: Plugin name
        required: true
      - name: key
        description: Setting key
        required: true
      - name: value
        description: Setting value
        required: true
  - name: plugin-config
    description: command.plugin-config.description
    code: handlePluginConfig
    args:
      - name: name
        description: Plugin name
        required: true
  - name: conversations
    description: command.conversations.description
    code: handleConversations
  - name: where-rule
    description: command.where-rule.description
    code: handleWhereRule
    args:
      - name: pattern
        description: Command pattern
        required: true
      - name: where
        description: dm or group
        required: true
  - name: broadcast-add
    description: command.broadcast-add.description
    code: handleBroadcastAdd
    args:
      - name: channel
        description: Channel name
        required: true
      - name: conversation
        description: Conversation id
        required: true
  - name: broadcast
    description: command.broadcast.description
    code: handleBroadcast
    args:
      - name: text
        description: What to send
        required: true
  - name: inhibitor-channels
    description: command.inhibitor-channels.description
    code: handleInhibitorChannels
    args:
      - name: name
        description: Inhibitor name
        required: true
  - name: lang
    description: command.lang.description
    code: handleLang
    args:
      - name: locale
        description: arg.locale.description
        required: true
  - name: lang-group
    description: command.lang-group.description
    code: handleLangGroup
    args:
      - name: locale
        description: arg.locale.description
        required: true
