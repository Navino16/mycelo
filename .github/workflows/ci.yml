name: ci

on:
  # Deliberately NOT feature/**. Triggering on both a feature push and its pull
  # request produces two runs on the same commit, and the cancelled one shows on
  # the PR as a failed check — GitHub aggregates checks from every event.
  #
  # What guarantees CI on a phase branch instead is the convention: open the draft
  # pull request with the phase's first commit, not at the end. Draft does not
  # suppress pull_request runs.
  push:
    branches: [main, develop]
  pull_request:

# Only contents: read is needed. Declared explicitly rather than inheriting the
# repository default, which is broader.
permissions:
  contents: read

# With no overlapping triggers, the PR number is the right key: successive pushes
# to an open PR collapse into one group and the superseded run is cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Read from .nvmrc so the pinned version lives in one place and cannot
          # drift from what engines.node requires.
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` rather than `npm install`: it fails when the lockfile disagrees
      # with package.json, which is exactly what CI should catch.
      - run: npm ci

      # The three checks are separate steps so the Actions UI names which one
      # failed. They are the same commands `npm run ci` chains locally — a CI
      # running something different from the developer is a CI that lies.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
