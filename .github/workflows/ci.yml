name: ci

on:
  # Deliberately NOT feature/**: a feature push and its pull request would produce
  # two runs on the same commit, and the cancelled one shows on the PR as a failed
  # check. CI on a phase branch comes from opening the draft PR with the phase's
  # first commit instead — draft does not suppress pull_request runs.
  push:
    branches: [main, develop]
  pull_request:
  # Manual re-run from the Actions tab, without pushing an empty commit.
  workflow_dispatch:

# Narrower than the repository default, which this does not inherit.
permissions:
  contents: read

# With no overlapping triggers, the PR number is the right key: successive pushes
# to an open PR collapse into one group and the superseded run is cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # The pinned version lives in .nvmrc alone, so it cannot drift.
          node-version-file: .nvmrc
          cache: npm

      # `npm ci`, not `npm install`: it fails when the lockfile disagrees with
      # package.json.
      - run: npm ci

      # Separate steps so the Actions UI names the one that failed. Same commands
      # `npm run ci` chains locally.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
