name: ci

on:
  push:
    # feature/** matters: a phase is developed on a branch for days before its PR
    # is opened, and a workflow that never runs looks exactly like one that passes.
    branches: [main, develop, 'feature/**']
  pull_request:

# Only contents: read is needed. Declared explicitly rather than inheriting the
# repository default, which is broader.
permissions:
  contents: read

# head_ref is the source branch on a pull_request and empty on a push; ref_name is
# the branch on a push. Both resolve to the same string, so a push to a branch with
# an open PR lands in one group and the duplicate run is cancelled rather than run
# twice on the same commit. Keying on pull_request.number does NOT work: it is empty
# on the push event, so the two events end up in different groups.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Read from .nvmrc so the pinned version lives in one place and cannot
          # drift from what engines.node requires.
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` rather than `npm install`: it fails when the lockfile disagrees
      # with package.json, which is exactly what CI should catch.
      - run: npm ci

      # The three checks are separate steps so the Actions UI names which one
      # failed. They are the same commands `npm run ci` chains locally — a CI
      # running something different from the developer is a CI that lies.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
